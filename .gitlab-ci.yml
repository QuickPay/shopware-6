variables:
  BASEBUILD_BRANCH: "master"
  PLUGIN_NAME: "WexoQuickpay"
  PLUGIN_COMPOSER_NAME: "wexo/quickpay"

sync_to_github:
  stage: deploy
  when: manual
  script:
    - git remote add github https://oauth2:${GITHUB_TOKEN}@github.com/QuickPay/shopware-6.git || true
    - git fetch origin 6.7 6.6 6.5
    - git push github origin/6.7:6.7 origin/6.6:6.6 origin/6.5:6.5 --force
  only:
    - tags
  except:
    - branches

# TEMP Untill shopware-cli is used in shared pipeline
codesniffer:
  stage: lint
  image: registry.services.wexo.dk:4567/wexo-services/docker-magento/shopware-plugins-quality-php:8.4-fpm
  script:
    - ~/phpcs.sh
  allow_failure: false

PHP Static Analysis:
  stage: lint

  variables:
    VALIDATION_TOOLS: 'phpstan,sw-cli'

  image:
    name: ghcr.io/shopware/shopware-cli:latest
    entrypoint: [ "/bin/sh", "-c" ]
  parallel:
    matrix:
      - CHECK_AGAINST: [ 'lowest', 'highest' ]
  script:
    - echo "🔎 Validate ${CHECK_AGAINST} with ${VALIDATION_TOOLS}"
    - set -e
    - shopware-cli extension validate --full --only=${VALIDATION_TOOLS} --check-against ${CHECK_AGAINST} --reporter=json . | tee output.json

